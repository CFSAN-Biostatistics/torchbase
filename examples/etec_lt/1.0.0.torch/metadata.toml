namespace = "examples"
name = "etec_lt"
version = "1.0.0"
typing_model = "operon"

[typing]
method = "operon"
scheme = "ETEC heat-labile enterotoxin (elt/LT-I)"
subtypes_count = 2

[description]
short = "ETEC heat-labile toxin (LT-I) operon torch"
long = "eltA/eltB operon typing. LT1 and LT2 are separated by the residue signature described in Lasaro et al. 2008 (J Bacteriol 190:2400, PMID 18223074): A S190L/G196D/K213E/S224T and B T75A on the mature proteins. Operons whose signature matches neither are reported as LT-I (class 'I'), which includes the other 14 types in that paper — they differ at positions this table does not read."
taxa = [ "Escherichia coli",]

[provenance]
source = "GenBank S60731, EU113242-EU113255"
reference = "Lasaro et al. 2008, J Bacteriol 190:2400 (PMID 18223074)"

[manifest]
profiles = "profiles.tsv"

[operon]
subunit_order = [ "A", "B",]
intergenic_min = -12
intergenic_max = 36
intergenic_relax_factor = 2
require_same_strand = true
require_same_contig = true
min_operon_identity = 0.8
overlap_slack = 30
[[operon.residue_rules]]
class = "I"
fallback = "I"
[[operon.residue_rules.positions]]
subunit = "A"
index = 207

[[operon.residue_rules.positions]]
subunit = "A"
index = 213

[[operon.residue_rules.positions]]
subunit = "A"
index = 230

[[operon.residue_rules.positions]]
subunit = "A"
index = 241

[[operon.residue_rules.positions]]
subunit = "B"
index = 95

[[operon.residue_rules.table]]
call = "1"
residues = [ [ "S",], [ "G",], [ "K",], [ "S",], [ "T",],]

[[operon.residue_rules.table]]
call = "2"
residues = [ [ "L",], [ "D",], [ "E",], [ "T",], [ "A",],]


[operon.reference]
file = "_resources/subunits.faa"
header_format = "accession|subunit_role|reference_subtype|class"

[operon.identity_thresholds]
default = 0.95
I = 0.95

[operon.generalized_classes]
I = [ "1", "2",]
